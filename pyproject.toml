[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hue-task-mcp"
version = "0.1.0"
description = "Ambient Philips Hue light feedback for AI agents (Antigravity CLI hooks & MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
hue-agent-feedback = "hue_task_mcp.cli:main"
hue-task-mcp = "hue_task_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["hue_task_mcp*"]
