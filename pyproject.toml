[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "HueAgentFeedback"
version = "0.2.0"
description = "Ambient Philips Hue light feedback for AI coding agents via lifecycle hooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hue-agent-feedback = "hue_task_mcp.cli:main"
hue-task-mcp = "hue_task_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["hue_task_mcp*"]
